<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <link rel="stylesheet" href="./static/css/bootstrap.min.css">
    <link rel="stylesheet" href="./static/css/animated.css">
    <link href="./static/scripts/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="./static/css/sb-admin-2.min.css" rel="stylesheet">
    <script type="text/javascript" src="./static/scripts/jquery-2.2.3.min.js"></script>
    <script type="text/javascript" src="./static/scripts/popper.min.js"></script>
    <script type="text/javascript" src="./static/scripts/bootstrap.min.js"></script>
    <script src="./static/scripts/moment.min.js"></script>
    <link rel="stylesheet" href="./static/css/bootstrap-datetimepicker.min.css">
    <script src="./static/scripts/bootstrap-datetimepicker.min.js"></script>
</head>

<body id="page-top">
  <!-- ... content as before ... -->
  <!-- Just the KPI box numbers part is replaced below -->
  <div class="row">
    <!-- Parcels Today -->
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-primary shadow h-10 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Parcels Total</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" id="jobs-count">-</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-boxes fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Drivers Today -->
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-success shadow h-10 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Drivers Total</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" id="drivers-count">-</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-truck fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Customers Total -->
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-info shadow h-10 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Customers Total</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" id="customers-count">-</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-user-friends fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Revenue Today -->
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-warning shadow h-10 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Total Revenue</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800" id="revenue-count">-</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-pound-sign fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // JS to load KPIs dynamically from API
    fetch('/api/kpis')
      .then(resp => resp.json())
      .then(data => {
        if(data.jobs !== undefined) document.getElementById('jobs-count').textContent = data.jobs;
        if(data.drivers !== undefined) document.getElementById('drivers-count').textContent = data.drivers;
        if(data.customers !== undefined) document.getElementById('customers-count').textContent = data.customers;
        if(data.revenue !== undefined) document.getElementById('revenue-count').textContent = data.revenue;
      });
  </script>
  <!-- ... rest of original template ... -->
</body>
</html>
